<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#5B8DEF'/>
      <stop offset='1' stop-color='#2B57C9'/>
    </linearGradient>
  </defs>
  <!-- 圆角渐变底板 + 白色工具箱，蓝色锁扣，Chrome 三色圆点 -->
  <rect width='128' height='128' rx='28' fill='url(#bg)'/>
  <!-- 提手 -->
  <path d='M50 58v-9a14 14 0 0 1 28 0v9' fill='none' stroke='#ffffff' stroke-width='7'/>
  <!-- 箱盖 -->
  <rect x='26' y='54' width='76' height='14' rx='7' fill='#ffffff'/>
  <!-- 箱体 -->
  <rect x='30' y='66' width='68' height='40' rx='9' fill='#ffffff'/>
  <!-- 箱盖接缝 -->
  <rect x='32' y='66' width='25' height='2.4' fill='#BECEEE'/>
  <rect x='71' y='66' width='25' height='2.4' fill='#BECEEE'/>
  <!-- Chrome 三色点缀 -->
  <circle cx='48' cy='88' r='5' fill='#EA4335'/>
  <circle cx='64' cy='88' r='5' fill='#FBBC05'/>
  <circle cx='80' cy='88' r='5' fill='#34A853'/>
  <!-- 蓝色锁扣（压住接缝） -->
